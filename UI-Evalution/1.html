<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .show{
            text-align:center
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click me</title>

        }
    </script>
