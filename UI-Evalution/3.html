<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>TO-DO LIST</h1>
    <input type="text" id="task" placeholder="Enter the task">
    <button onclick="add()" style="background-color:red">Add</button>
    <p id="demo"></p>
    <script>
        function add(){
            let task=document.getElementById("task").value;
            document.getElementById("demo").innerHTML=task;
        }
    </script>
</body>
</html>
