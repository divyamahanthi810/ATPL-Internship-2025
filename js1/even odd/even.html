<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even and Odd Checker</title>
</head>
<body>
    <script>
        let a=prompt("Please Enter a number");
        if(a%2==0){
            alert("Entered number "+a+" is even number");
        }
        else{
            alert("Entered number "+a+" is odd number");
        }
    </script>
    
</body>
</html>
