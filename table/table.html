<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplicat Table</title>
    <link rel="stylesheet" href="style.css">
    <script src="table.js"></script>
</head>
<body>
    <label for="table">ENTER NUMBER</label>
    <input type="number" id="table"><br><br>
    <button onclick="fun()">Submit</button>
    <p id="demo"></p>
    <script>
        function fun() {
            let number1 = parseFloat(document.getElementById("table").value);
            if (number1<0) {
                document.getElementById("demo").innerText = "Please enter a valid number.";
                return;
            }

            let output = "";
            for (let val = 1; val <= 10; val++) {
                output += `${number1} x ${val} = ${number1 * val}<br>`;
            }

            document.getElementById("demo").innerHTML = output;
        }
    </script>

</body>
</html>
