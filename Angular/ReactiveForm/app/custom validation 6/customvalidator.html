<h3 style="text-align:center">Custom Validate Password</h3>

<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <label for="name">Name:</label><br>
    <input id="name" type="text" formControlName="name">
    <div *ngIf="userForm.controls['name']!.invalid && userForm.controls['name']!.touched" class="error">
        Name is required and must be at least 3 characters long.
    </div><br><br>
    <label for="password">Password:</label><br>
    <input id="password" type="password" formControlName="password" >
    <div *ngIf="userForm.controls['password']!.invalid && userForm.controls['password']!.touched" class="error">
        Password is required and must be at least 6 characters long.
    </div><br><br>

    <label for="confirmPassword">Confirm Password:</label><br>
    <input id="confirmPassword" type="password" formControlName="confirmPassword">
    <div *ngIf="userForm.controls['confirmPassword']!.invalid &&
                userForm.controls['confirmPassword']!.touched" class="error">
        Confirm Password is required.
    </div>
    <div *ngIf="userForm.errors?.['passwordsMismatch']" class="error">
        Passwords do not match.
    </div><br><br>

    <button type="submit" [disabled]="userForm.invalid">Submit</button>
</form><br>
