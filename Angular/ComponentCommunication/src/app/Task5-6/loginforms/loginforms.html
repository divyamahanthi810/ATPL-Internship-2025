<h1>Login Form</h1>
<div class="user">
<form [formGroup]="userform" (ngSubmit)="Submit(userform)">
    <label for="name"><strong>UserName</strong></label><br>
    <input type="text" name="name" placeholder="Enter username" formControlName="name"><br>
    <label for="age"><strong>Age</strong></label><br>
    <input type="number" name="age" placeholder="Enter Age" formControlName="age"><br>
    <button type="submit">Submit</button>
    <button type="button">Logout</button>
</form>
</div>
