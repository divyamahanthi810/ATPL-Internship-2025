<mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
      <span style="color:white">Student Playground</span>
      <span class="spacer"></span>
      <mat-slide-toggle (change)="toggleTheme()" [checked]="isDarkTheme">
        Dark Mode
      </mat-slide-toggle>
</mat-toolbar> 
<mat-sidenav-container class="app-container" [class.dark-theme]="isDarkTheme">
  <mat-sidenav  class="sidenav" #drawer mode="side" >
    <mat-nav-list >
      <a mat-list-item routerLink="dashboard" routerLinkActive="active-link">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a mat-list-item routerLink="profile" routerLinkActive="active-link">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </a>
      <a mat-list-item routerLink="setting" routerLinkActive="active-link">
        <mat-icon>settings</mat-icon>
        <span>Setting</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>

    <div class="main-content">
      <mat-card class="welcome-card" align="center">
        <mat-card-title >Welcome to the Dashboard</mat-card-title><br>
        <mat-card-content >
          Students Data Displayed Here.
        </mat-card-content><br>
        <button mat-raised-button color="accent" (click)="openDialog()">Open Dialog</button>
      </mat-card>
      <mat-card>
        <mat-card-title align="center" style="color:rgb(137, 51, 187)">Students Data</mat-card-title>
        <mat-card-content align="center">
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef> ID </th>
              <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef> Name </th>
              <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>

            <ng-container matColumnDef="Grade">
              <th mat-header-cell *matHeaderCellDef> Grade </th>
              <td mat-cell *matCellDef="let element"> {{element.Grade}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </mat-card-content>
      </mat-card>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
