<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                display: flex;
                flex-wrap:wrap;
                background-color:rgb(162, 167, 238);
                text-align: center;
                row-gap: 20px;
                column-gap: 20px;
                padding:20px;
            }
            .container > div{
                font-size:10px;
                text-align:center;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                padding:10px;
                margin:auto;
                background-color: rgb(221, 199, 215);
                color:rgb(102, 89, 70);
                width:80px;
                height:10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="card1">Card 1</div>
            <div class="card2">Card 2</div>
            <div class="card3">Card 3</div>
            <div class="card4">Card 4</div>
            <div class="card5">Card 5</div>
            <div class="card6">Card 6</div>
        </div>
    </body>
