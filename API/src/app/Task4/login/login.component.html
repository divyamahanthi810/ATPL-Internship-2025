<div class="container">
<h2>Login</h2>
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <label>Email:</label>
  <input formControlName="email" type="email"><br>
  <label>Password:</label>
  <input formControlName="password" type="password"><br>
  <button type="submit">Login</button>
</form>
<p>{{ message }}</p>
</div>
