<!DOCTYPE html>
<html>
<head>
  <title>User Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      background-color: #fff;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 200px;
    }
    .card h3 {
      margin: 0;
      color: #333;
    }
    .card p {
      margin: 5px 0 0;
      color: #666;
    }
  </style>
</head>
<body>

  <h2>User Cards</h2>
  <div class="container" id="cardContainer"></div>

  <script>
    const users = [
      { name: "John", age: 25 },
      { name: "Rita", age: 22 },
      { name: "Sam", age: 30 }
    ];

    const container = document.getElementById("cardContainer");

    users.forEach(user => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<h3>${user.name}</h3><p>Age: ${user.age}</p>`;
      container.appendChild(card);
    });
  </script>

</body>
</html>
