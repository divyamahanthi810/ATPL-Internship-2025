<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Number</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height:500px;
      margin: 0;
      background-color: #f5f5f5;
      border-radius:0cap;
    }
    .container {
      text-align: center;
      background-color: rgb(224, 190, 190);
      padding: 20px;
      border-radius: 10px;
    }
    button {
      background-color: blue;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    input {
      padding: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Guess the number</h3>
    <input type="number" id="num"><br><br>
    <button onclick="myFunction()">Click Me</button>
    <p id="demo"></p>
  </div>

  <script>
    function myFunction(){
        let no = 55;
        let ab = parseFloat(document.getElementById("num").value);

        if (ab === no) {
            document.getElementById("demo").innerHTML = "Correct";
        } else if (ab < no) {
            document.getElementById("demo").innerHTML = "Too less";
        } else {
            document.getElementById("demo").innerHTML = "Too high";
        }
    }
  </script>
</body>
</html>
